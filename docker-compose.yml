services:
  postgres:
    image: postgres:16
    container_name: edc_invoice_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edc_invoice}
      POSTGRES_USER: ${POSTGRES_USER:-edcuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edcpass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: edc_invoice_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    volumes:
      - invoice_files:/app/generated

  frontend:
    build: ./frontend
    container_name: edc_invoice_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  invoice_files:
