services:
  postgres:
    image: postgres:16
    container_name: edc_invoice_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edc_invoice}
      POSTGRES_USER: ${POSTGRES_USER:-edcuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edcpass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: edc_invoice_backend
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"
    depends_on:
      - postgres
    volumes:
      - invoice_files:/app/generated

  frontend:
    build: ./frontend
    container_name: edc_invoice_frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    container_name: edc_invoice_caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  postgres_data:
  invoice_files:
  caddy_data:
  caddy_config:
